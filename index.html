<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>InvoiceHub - Modern Billing</title>

    <!-- PWA icons (manifest auto-injected by vite-plugin-pwa) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Theme color: dynamic light/dark for status bar -->
    <meta name="theme-color" content="#10b981" />

    <!-- iOS standalone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvoiceHub" />
    <meta name="application-name" content="InvoiceHub" />

    <!-- Misc -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Modern SIM card distribution and billing dashboard" />

    <script>
      // Defensive fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when some libraries try to overwrite window.fetch in restricted environments.
      (function() {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function(v) { console.warn('Something tried to overwrite window.fetch:', v); }
          });
        } catch (e) {
          console.error('Failed to patch fetch getter/setter:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
